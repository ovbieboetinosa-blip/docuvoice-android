name: Build Android APK (5 Bundled Voices)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libsndfile1-dev bzip2
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Download & Extract All 5 Documentary Voices into assets/models
        run: |
          mkdir -p assets/models
          cd assets/models

          VOICES=(
            "vits-piper-en_US-ryan-high"
            "vits-piper-en_GB-alan-medium"
            "vits-piper-en_US-amy-medium"
            "vits-piper-en_GB-jenny_dioco-medium"
            "vits-piper-en_US-joe-medium"
          )

          for v in "${VOICES[@]}"; do
            echo "Downloading $v..."
            curl -L -sS "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${v}.tar.bz2" -o "${v}.tar.bz2"
            tar -xjf "${v}.tar.bz2"
            rm "${v}.tar.bz2"
          done

          ls -lh

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuVoice-Studio-5Voices-APK
          path: bin/*.apk
